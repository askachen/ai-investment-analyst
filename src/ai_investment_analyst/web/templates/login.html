<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入 AI 投資分析師</title>
    <style>
      :root {
        --bg: #07111f;
        --card: #0f1f33;
        --line: rgba(148, 163, 184, 0.18);
        --text: #ecf5ff;
        --muted: #99a9bf;
        --accent: #60a5fa;
        --accent-2: #2563eb;
        --danger: #fb7185;
        --shadow: 0 20px 45px rgba(2, 6, 23, 0.35);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at top right, rgba(37, 99, 235, 0.22), transparent 28%),
          radial-gradient(circle at top left, rgba(251, 113, 133, 0.15), transparent 24%),
          var(--bg);
        color: var(--text);
      }
      .card {
        width: min(100%, 460px);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px;
        background: linear-gradient(180deg, rgba(19, 40, 68, 0.96), rgba(10, 21, 37, 0.98));
        box-shadow: var(--shadow);
      }
      h1 { margin: 0 0 10px; font-size: 30px; }
      .muted { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
      .error {
        color: #ffd6db;
        background: rgba(251, 113, 133, 0.12);
        border: 1px solid rgba(251, 113, 133, 0.2);
        border-radius: 12px;
        margin-bottom: 14px;
        padding: 10px 12px;
      }
      label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
      input, button { font-size: 16px; width: 100%; }
      input {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text);
      }
      button {
        margin-top: 18px;
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      @media (max-width: 640px) {
        body { align-items: flex-start; padding: 16px 12px; }
        .card { padding: 22px 18px; }
        h1 { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>登入 AI 投資分析師</h1>
      <p class="muted">請先輸入帳號與密碼，才能查看股票分析報告。</p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label for="username">帳號</label>
        <input id="username" type="text" name="username" placeholder="請輸入帳號（預設 {{ username_placeholder }}）" autocomplete="username" required />
        <label for="password">密碼</label>
        <input id="password" type="password" name="password" placeholder="請輸入網站密碼" autocomplete="current-password" required />
        <button type="submit">登入</button>
      </form>
    </div>
  </body>
</html>
