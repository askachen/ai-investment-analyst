<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ display_title }}｜AI 投資分析師</title>
    <style>
      :root {
        --bg: #07111f;
        --card: #0f1f33;
        --line: rgba(148, 163, 184, 0.18);
        --text: #ecf5ff;
        --muted: #99a9bf;
        --accent: #60a5fa;
        --accent-2: #2563eb;
        --rose: #fb7185;
        --shadow: 0 20px 45px rgba(2, 6, 23, 0.35);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at top right, rgba(37, 99, 235, 0.22), transparent 30%),
          radial-gradient(circle at top left, rgba(251, 113, 133, 0.16), transparent 24%),
          var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 16px 56px;
      }

      .shell {
        background: linear-gradient(180deg, rgba(19, 40, 68, 0.96), rgba(10, 21, 37, 0.98));
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .header {
        padding: 22px 24px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: 34px;
        line-height: 1.1;
      }

      .header p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .back-link,
      .logout-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 10px 14px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }

      .back-link {
        background: rgba(96, 165, 250, 0.12);
        color: #dbeafe;
        border: 1px solid rgba(96, 165, 250, 0.22);
      }

      .logout-form {
        margin: 0;
      }

      .logout-button {
        border: 1px solid rgba(251, 113, 133, 0.26);
        background: rgba(251, 113, 133, 0.12);
        color: #ffd4da;
        cursor: pointer;
      }

      .report-wrapper {
        padding: 22px 24px 24px;
      }

      .report-card { display: grid; gap: 20px; }
      .report-header h1 { margin: 0 0 8px; font-size: 32px; }
      .report-badges { display: flex; gap: 10px; flex-wrap: wrap; }
      .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
      .badge-rating { background: rgba(96, 165, 250, 0.14); color: #dbeafe; }
      .badge-confidence { background: rgba(52, 211, 153, 0.14); color: #c9ffe6; }
      .report-nav {
        display: grid;
        gap: 12px;
        padding: 16px 18px;
        border-radius: 18px;
        background: rgba(8, 19, 33, 0.72);
        border: 1px solid rgba(96, 165, 250, 0.18);
      }
      .report-insights {
        display: grid;
        gap: 12px;
        padding: 18px;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(37, 99, 235, 0.18));
        border: 1px solid rgba(96, 165, 250, 0.18);
      }
      .report-insights-title {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #bfd7f7;
      }
      .report-insights-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
      }
      .insight-card {
        display: grid;
        gap: 6px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }
      .insight-label {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #9db2d1;
      }
      .insight-card strong {
        font-size: 16px;
        line-height: 1.55;
        color: #f8fbff;
      }
      .report-nav-label {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #bfd7f7;
      }
      .scenario-overview {
        display: grid;
        gap: 12px;
        padding: 18px;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(96, 165, 250, 0.14));
        border: 1px solid rgba(96, 165, 250, 0.18);
      }
      .observation-radar {
        display: grid;
        gap: 12px;
        padding: 18px;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(148, 163, 184, 0.12));
        border: 1px solid rgba(148, 163, 184, 0.18);
      }
      .scenario-overview-title {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #bfd7f7;
      }
      .observation-radar-title {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #d8e5f8;
      }
      .analyst-takeaway,
      .risk-focus {
        display: grid;
        gap: 12px;
        padding: 18px;
        border-radius: 20px;
        border: 1px solid rgba(148, 163, 184, 0.18);
      }
      .analyst-takeaway {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.16), rgba(15, 23, 42, 0.88));
        border-color: rgba(96, 165, 250, 0.2);
      }
      .risk-focus {
        background: linear-gradient(135deg, rgba(251, 113, 133, 0.14), rgba(15, 23, 42, 0.88));
        border-color: rgba(251, 113, 133, 0.22);
      }
      .analyst-takeaway-title,
      .risk-focus-title {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .analyst-takeaway-title {
        color: #dbeafe;
      }
      .risk-focus-title {
        color: #ffd4da;
      }
      .analyst-takeaway-text,
      .risk-focus-list {
        margin: 0;
        color: #f8fbff;
        line-height: 1.7;
      }
      .risk-focus-list {
        padding-left: 20px;
      }
      .risk-focus-list li {
        margin-bottom: 8px;
      }
      .report-nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .report-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.2);
        color: #e6f0ff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }
      .report-section { border-top: 1px solid var(--line); padding-top: 18px; scroll-margin-top: 16px; }
      .report-section-lead {
        padding: 20px;
        border-top: 0;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(15, 23, 42, 0.5));
        border: 1px solid rgba(96, 165, 250, 0.16);
      }
      .report-section h2 { margin: 0 0 10px; font-size: 20px; }
      .report-section p { margin: 0 0 10px; line-height: 1.7; }
      .lead-paragraph {
        margin: 0;
        font-size: 18px;
        line-height: 1.8;
        color: #f8fbff;
      }
      .report-section ul { margin: 0; padding-left: 20px; }
      .report-section li { margin-bottom: 8px; line-height: 1.6; }
      .financial-snapshot-grid,
      .scenario-grid,
      .observation-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
      .financial-snapshot-card,
      .scenario-card,
      .observation-card {
        display: grid;
        gap: 8px;
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }
      .financial-snapshot-label,
      .scenario-card-label,
      .observation-card-label {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #9db2d1;
      }
      .financial-snapshot-value {
        font-size: 24px;
        line-height: 1.2;
        color: #f8fbff;
      }
      .scenario-card-bull {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(15, 23, 42, 0.88));
        border-color: rgba(52, 211, 153, 0.2);
      }
      .scenario-card-base {
        background: linear-gradient(135deg, rgba(96, 165, 250, 0.12), rgba(15, 23, 42, 0.88));
        border-color: rgba(96, 165, 250, 0.2);
      }
      .scenario-card-bear {
        background: linear-gradient(135deg, rgba(251, 113, 133, 0.12), rgba(15, 23, 42, 0.88));
        border-color: rgba(251, 113, 133, 0.2);
      }
      .observation-card-bull {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(15, 23, 42, 0.88));
        border-color: rgba(52, 211, 153, 0.2);
      }
      .observation-card-neutral {
        background: linear-gradient(135deg, rgba(148, 163, 184, 0.14), rgba(15, 23, 42, 0.88));
        border-color: rgba(148, 163, 184, 0.24);
      }
      .observation-card-bear {
        background: linear-gradient(135deg, rgba(251, 113, 133, 0.12), rgba(15, 23, 42, 0.88));
        border-color: rgba(251, 113, 133, 0.2);
      }
      .scenario-card p,
      .scenario-card ul {
        margin: 0;
      }
      .observation-card p,
      .observation-card ul {
        margin: 0;
      }

      @media (max-width: 768px) {
        .page { padding: 14px 10px 28px; }
        .shell { border-radius: 18px; }
        .header { padding: 16px 16px 14px; }
        .header h1 { font-size: 26px; }
        .report-wrapper { padding: 16px; }
        .report-header h1 { font-size: 24px; }
        .actions { width: 100%; }
        .back-link,
        .logout-button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="shell">
        <header class="header">
          <div>
            <h1>{{ display_title }}</h1>
            <p>個股完整分析報告，包含評級、基本面、估值與風險摘要。</p>
          </div>
          <div class="actions">
            <a class="back-link" href="/">返回推薦榜單</a>
            {% if show_logout %}
            <form class="logout-form" method="post" action="/logout">
              <button type="submit" class="logout-button">登出</button>
            </form>
            {% endif %}
          </div>
        </header>
        <div class="report-wrapper">{{ report_html|safe }}</div>
      </section>
    </main>
  </body>
</html>
