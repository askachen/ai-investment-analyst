<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 投資分析師</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-soft: #0d1b2c;
        --card: #0f1f33;
        --card-2: #132844;
        --line: rgba(148, 163, 184, 0.18);
        --text: #ecf5ff;
        --muted: #99a9bf;
        --accent: #60a5fa;
        --accent-2: #2563eb;
        --rose: #fb7185;
        --rose-soft: rgba(251, 113, 133, 0.16);
        --emerald: #34d399;
        --emerald-soft: rgba(52, 211, 153, 0.14);
        --amber: #fbbf24;
        --amber-soft: rgba(251, 191, 36, 0.14);
        --white: #ffffff;
        --shadow: 0 20px 45px rgba(2, 6, 23, 0.35);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
        background:
          radial-gradient(circle at top right, rgba(37, 99, 235, 0.22), transparent 30%),
          radial-gradient(circle at top left, rgba(251, 113, 133, 0.16), transparent 24%),
          var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 1320px;
        margin: 0 auto;
        padding: 24px 16px 56px;
      }

      .hero,
      .dashboard,
      .panel,
      .report-shell {
        background: linear-gradient(180deg, rgba(19, 40, 68, 0.96), rgba(10, 21, 37, 0.98));
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 28px;
        margin-bottom: 18px;
      }

      .hero-top {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .hero-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: 38px;
        line-height: 1.1;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
      }

      .hero-badges {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .logout-form {
        margin: 0;
      }

      .logout-button {
        padding: 9px 14px;
        border: 1px solid rgba(251, 113, 133, 0.26);
        border-radius: 999px;
        background: rgba(251, 113, 133, 0.12);
        color: #ffd4da;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .hero-badge {
        padding: 9px 14px;
        border-radius: 999px;
        border: 1px solid rgba(96, 165, 250, 0.22);
        background: rgba(96, 165, 250, 0.12);
        color: #dbeafe;
        font-size: 13px;
        font-weight: 700;
      }

      .dashboard {
        overflow: hidden;
        margin-bottom: 20px;
      }

      .dashboard-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.18), rgba(15, 23, 42, 0));
      }

      .dashboard-header h2 {
        margin: 0;
        font-size: 24px;
      }

      .dashboard-subtitle,
      .muted {
        color: var(--muted);
        font-size: 14px;
      }

      .screener-scroll {
        overflow-x: auto;
      }

      .screener-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1020px;
      }

      .screener-table thead th {
        text-align: left;
        padding: 16px 18px;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #d6e4ff;
        background: rgba(15, 23, 42, 0.52);
      }

      .screener-table tbody td {
        padding: 18px;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }

      .screener-table tbody tr:hover {
        background: rgba(148, 163, 184, 0.05);
      }

      .stock-cell {
        min-width: 220px;
      }

      .stock-link {
        display: block;
        color: inherit;
        text-decoration: none;
      }

      .stock-link:hover .stock-main,
      .stock-link:focus-visible .stock-main {
        color: #bfdbfe;
      }

      .stock-link:focus-visible {
        outline: 2px solid rgba(96, 165, 250, 0.7);
        outline-offset: 4px;
        border-radius: 14px;
      }

      .stock-rank {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.3), rgba(96, 165, 250, 0.14));
        color: #eff6ff;
        font-weight: 900;
        margin-bottom: 10px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .rank-value {
        font-size: 28px;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .stock-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .stock-main {
        display: grid;
        gap: 3px;
        font-size: 22px;
        font-weight: 800;
        line-height: 1.15;
      }

      .stock-code {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .stock-name {
        color: #f8fbff;
        font-size: 16px;
        font-weight: 700;
      }

      .score-details {
        min-width: 120px;
      }

      .score-details summary {
        list-style: none;
      }

      .score-details summary::-webkit-details-marker {
        display: none;
      }

      .score-badge {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        padding: 9px 12px;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.92), rgba(96, 165, 250, 0.88));
        color: white;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
      }

      .score-badge strong {
        font-size: 24px;
        line-height: 1;
      }

      .score-panel {
        margin-top: 10px;
        padding: 12px;
        border-radius: 14px;
        background: rgba(8, 19, 33, 0.92);
        border: 1px solid rgba(96, 165, 250, 0.18);
      }

      .factor-explainer {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .factor-explainer p {
        margin: 0 0 8px;
      }

      .factor-explainer p:last-child {
        margin-bottom: 0;
      }

      .stock-main small {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
      }

      .breakout-badge {
        display: inline-flex;
        margin-top: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--rose-soft);
        color: #fecdd3;
        font-size: 12px;
        font-weight: 700;
      }

      .compact-topline {
        display: none;
      }

      .compact-meta-grid {
        display: none;
      }

      .metric-card {
        display: grid;
        gap: 10px;
      }

      .metric-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
        font-size: 14px;
      }

      .metric-label {
        color: var(--muted);
      }

      .metric-value {
        color: var(--white);
        font-weight: 700;
        text-align: right;
      }

      .market-summary,
      .fundamental-summary {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        color: #dce8f8;
        font-size: 13px;
        line-height: 1.5;
      }

      .factor-grid {
        display: grid;
        gap: 10px;
      }

      .factor-chip {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(96, 165, 250, 0.08);
        border: 1px solid rgba(96, 165, 250, 0.14);
        font-size: 13px;
      }

      .factor-chip span:last-child {
        color: #dbeafe;
        font-weight: 700;
      }

      .score-box {
        min-width: 180px;
      }

      .score-box-hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .score-box-hint strong {
        color: #dbeafe;
      }

      .score-pill {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.92), rgba(96, 165, 250, 0.88));
        color: white;
        font-weight: 800;
      }

      .score-pill strong {
        font-size: 28px;
        line-height: 1;
      }

      .score-note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .compact-score-note {
        display: none;
      }

      .panel,
      .report-shell {
        padding: 22px;
        margin-top: 20px;
      }

      input, button, textarea {
        font-size: 16px;
      }

      input {
        width: min(280px, 100%);
        padding: 12px 14px;
        color: var(--text);
        background: rgba(15, 23, 42, 0.6);
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.22);
      }

      button {
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .form-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .report-card { display: grid; gap: 20px; }
      .report-header h1 { margin: 0 0 8px; font-size: 32px; }
      .report-badges { display: flex; gap: 10px; flex-wrap: wrap; }
      .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
      .badge-rating { background: rgba(96, 165, 250, 0.14); color: #dbeafe; }
      .badge-confidence { background: rgba(52, 211, 153, 0.14); color: #c9ffe6; }
      .report-section { border-top: 1px solid var(--line); padding-top: 18px; }
      .report-section h2 { margin: 0 0 10px; font-size: 20px; }
      .report-section p { margin: 0 0 10px; }
      .report-section ul { margin: 0; padding-left: 20px; }
      .report-section li { margin-bottom: 8px; }
      .placeholder {
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
        border: 1px dashed rgba(148, 163, 184, 0.24);
        border-radius: 16px;
        padding: 18px;
      }

      .legend {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .legend .hot { background: var(--rose); }
      .legend .good { background: var(--emerald); }
      .legend .warn { background: var(--amber); }

      @media (max-width: 900px) {
        .hero h1 { font-size: 30px; }
      }

      @media (max-width: 768px) {
        .page {
          padding: 10px 8px 24px;
        }

        .hero,
        .panel,
        .report-shell {
          padding: 14px;
          border-radius: 16px;
        }

        .hero-top {
          gap: 10px;
        }

        .hero-actions {
          width: 100%;
          align-items: stretch;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 8px;
          margin-left: 0;
        }

        .hero-badges {
          gap: 6px;
          justify-content: flex-start;
        }

        .hero-badge,
        .logout-button {
          padding: 6px 10px;
          font-size: 11px;
        }

        .dashboard {
          margin-bottom: 12px;
          border-radius: 16px;
        }

        .dashboard-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
          padding: 12px 14px;
        }

        .dashboard-header h2 {
          font-size: 18px;
        }

        .dashboard-subtitle,
        .muted {
          font-size: 11px;
        }

        .legend {
          gap: 6px;
        }

        .legend span {
          font-size: 10px;
        }

        .screener-table,
        .screener-table thead,
        .screener-table tbody,
        .screener-table th,
        .screener-table td,
        .screener-table tr {
          display: block;
          width: 100%;
        }

        .screener-table {
          min-width: 0;
        }

        .screener-table thead {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        }

        .screener-table tbody {
          display: grid;
          gap: 8px;
          padding: 8px;
        }

        .screener-table tbody tr {
          border: 1px solid var(--line);
          border-radius: 12px;
          overflow: hidden;
          background: rgba(255, 255, 255, 0.03);
        }

        .screener-table tbody td {
          border-top: 1px solid var(--line);
          padding: 8px 10px;
        }

        .screener-table tbody td:first-child {
          border-top: 0;
        }

        .screener-table tbody td::before {
          content: attr(data-label);
          display: block;
          margin-bottom: 4px;
          color: var(--muted);
          font-size: 10px;
          letter-spacing: 0.05em;
        }

        .stock-cell,
        .score-box {
          min-width: 0;
        }

        .stock-rank {
          width: 42px;
          height: 42px;
          margin-bottom: 4px;
        }

        .rank-value {
          font-size: 24px;
        }

        .stock-header {
          display: block;
        }

        .stock-main {
          gap: 1px;
          font-size: 16px;
        }

        .stock-code {
          gap: 6px;
        }

        .stock-name {
          font-size: 13px;
        }

        .score-details {
          margin-top: 8px;
          min-width: 0;
        }

        .score-badge {
          width: 100%;
          justify-content: space-between;
          padding: 7px 9px;
          border-radius: 10px;
          font-size: 11px;
        }

        .score-badge strong {
          font-size: 19px;
        }

        .score-panel {
          margin-top: 6px;
          padding: 9px;
          border-radius: 10px;
        }

        .factor-explainer {
          font-size: 11px;
          line-height: 1.35;
        }

        .stock-main small {
          margin-top: 1px;
          font-size: 11px;
        }

        .breakout-badge {
          margin-top: 6px;
          padding: 3px 7px;
          font-size: 10px;
        }

        .compact-topline {
          display: flex;
          justify-content: space-between;
          gap: 8px;
          margin-top: 8px;
          font-size: 11px;
          color: var(--muted);
        }

        .compact-topline strong {
          color: #f8fbff;
          font-size: 12px;
        }

        .compact-meta-grid {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
          margin-top: 8px;
        }

        .compact-meta-item {
          padding: 6px 7px;
          border-radius: 10px;
          background: rgba(255, 255, 255, 0.04);
        }

        .compact-meta-item span {
          display: block;
          color: var(--muted);
          font-size: 10px;
          margin-bottom: 2px;
        }

        .compact-meta-item strong {
          color: var(--white);
          font-size: 12px;
        }

        .metric-card,
        .factor-grid {
          gap: 6px;
        }

        .metric-row,
        .factor-chip {
          font-size: 11px;
        }

        .market-summary,
        .fundamental-summary {
          margin-top: 4px;
          padding: 8px 9px;
          font-size: 11px;
          line-height: 1.35;
        }

        .score-pill {
          width: 100%;
          justify-content: space-between;
          padding: 7px 9px;
          border-radius: 10px;
        }

        .score-pill strong {
          font-size: 19px;
        }

        .score-note {
          display: none;
        }

        .compact-score-note {
          display: block;
          margin-top: 5px;
          color: var(--muted);
          font-size: 11px;
          line-height: 1.3;
        }
      }

      @media (max-width: 640px) {
        .hero h1 { font-size: 28px; }
        .report-header h1 { font-size: 24px; }
        input, button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="hero-top">
          <div>
            <h1>AI 投資分析師</h1>
            <p>把每日推薦股做成可讀性更高的策略儀表板，並可直接往下延伸成完整個股分析報告。</p>
          </div>
          <div class="hero-actions">
            {% if show_logout %}
            <form class="logout-form" method="post" action="/logout">
              <button type="submit" class="logout-button">登出</button>
            </form>
            {% endif %}
            <div class="hero-badges">
              <span class="hero-badge">策略榜單</span>
              <span class="hero-badge">每日排程更新</span>
              <span class="hero-badge">可解釋模型</span>
            </div>
          </div>
        </div>
      </section>

      <section class="dashboard">
        <div class="dashboard-header">
          <div>
            <h2>推薦股策略排行</h2>
            <div class="dashboard-subtitle">類似策略儀表板的單頁展示：股票 / 盤面 / 基本面 / 模型</div>
          </div>
          <div class="legend">
            <span><i class="hot"></i> 強勢 / 突破</span>
            <span><i class="good"></i> 正向基本面</span>
            <span><i class="warn"></i> 需持續觀察</span>
          </div>
        </div>
        <div id="daily-screener" class="placeholder" style="margin: 18px;">載入今日推薦中...</div>
      </section>

      <section class="panel">
        <form id="report-form">
          <div class="form-row">
            <input type="text" name="ticker" id="ticker" placeholder="請輸入股票代號，例如 2330" value="{{ ticker }}" />
            <button type="submit">開始分析</button>
          </div>
        </form>
        <p class="muted">本內容僅供參考，不構成投資建議。</p>
      </section>

      <section class="report-shell">
        <div id="result-html" class="placeholder">{% if result %}{{ result }}{% else %}尚未產生報告{% endif %}</div>
      </section>
    </main>

    <script>
      const form = document.getElementById('report-form');
      const result = document.getElementById('result-html');
      const screener = document.getElementById('daily-screener');
      const submitButton = form.querySelector('button[type="submit"]');

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function factorLabel(key) {
        return {
          momentum: '盤面',
          revenue: '營收',
          quality: '品質',
          valuation: '估值',
          liquidity: '流動性',
        }[key] || key;
      }

      function formatDecimal(value, digits = 1) {
        if (value === null || value === undefined || value === '') {
          return 'N/A';
        }
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) {
          return String(value);
        }
        return numeric.toFixed(digits).replace(/\.0+$|(?<=\.[0-9]*[1-9])0+$/u, '');
      }

      function formatPrice(value) {
        return formatDecimal(value, 2);
      }

      function buildFactorExplanation(key, value) {
        const score = Number(value || 0);
        const base = {
          momentum: '看近 5 日與近 10 日漲幅；短線動能越強，分數越高。',
          revenue: '看月營收年增與月增；成長越明顯，分數越高。',
          quality: '看 EPS 是否為正且數值夠高；EPS 偏弱時容易接近 0 分。',
          valuation: '看 PE / PB 是否仍在相對可接受區間；越便宜分數越高。',
          liquidity: '看近 5 日平均成交量；量太小時流動性分數會偏低。',
        }[key] || '依據該因子的原始資料計算。';
        if (score <= 0) {
          return `${base} 目前顯示 0 分，通常代表該因子偏弱、資料不足，或未達基本門檻。`;
        }
        return base;
      }

      function buildMarketSummary(reasons) {
        return reasons[0] || '目前尚無額外盤面摘要。';
      }

      function buildFundamentalSummary(reasons) {
        return [reasons[1], reasons[2], reasons[3]].filter(Boolean).join(' ')
          || '目前尚無完整基本面摘要。';
      }

      function buildModelSummary(reasons) {
        return reasons[4] || reasons[5] || '模型綜合動能、營收、品質、估值與流動性進行排序。';
      }

      function buildReportUrl(ticker) {
        return `/stocks/${encodeURIComponent(ticker)}`;
      }

      function buildFactorChips(factorScores) {
        const entries = Object.entries(factorScores || {});
        if (entries.length === 0) {
          return '<div class="factor-chip"><span>模型因子</span><span>資料不足</span></div>';
        }
        return entries.map(([key, value]) => `
          <div class="factor-chip">
            <span>${escapeHtml(factorLabel(key))}</span>
            <span>${escapeHtml(formatDecimal(value))}/100</span>
          </div>
        `).join('');
      }

      function buildFactorExplanationList(factorScores) {
        const entries = Object.entries(factorScores || {});
        if (entries.length === 0) {
          return '<div class="factor-explainer"><p>目前沒有足夠資料可拆解模型因子。</p></div>';
        }
        return `
          <div class="factor-explainer">
            <p>總分：綜合五個因子加權後的結果。權重為盤面 25%、營收 30%、品質 15%、估值 20%、流動性 10%。</p>
            <p>為什麼會 0 分？通常代表該因子目前偏弱、資料不足，或沒有通過最低門檻。</p>
            ${entries.map(([key, value]) => `<p><strong>${escapeHtml(factorLabel(key))} ${escapeHtml(formatDecimal(value))}/100：</strong>${escapeHtml(buildFactorExplanation(key, value))}</p>`).join('')}
          </div>
        `;
      }

      function buildScreenerTable(payload) {
        const rows = payload.results.slice(0, 12).map((item) => {
          const reasons = item.reasons || [];
          const reportUrl = buildReportUrl(item.ticker);
          const totalScore = formatDecimal(item.total_score);
          const closePrice = formatPrice(item.close_price);
          return `
            <tr>
              <td class="stock-cell" data-label="股票">
                <div class="stock-rank"><span class="rank-value">${escapeHtml(item.rank)}</span></div>
                <div class="stock-header">
                  <a class="stock-link" href="${reportUrl}">
                    <div class="stock-main">
                      <div class="stock-code">
                        <span>${escapeHtml(item.ticker)}</span>
                        ${item.display_name ? `<span class="stock-name">${escapeHtml(item.display_name)}</span>` : ''}
                      </div>
                      <small>策略模型最新突破候選</small>
                    </div>
                  </a>
                  <details class="score-details">
                    <summary class="score-badge"><span>模型分數</span><strong>${escapeHtml(totalScore)}</strong></summary>
                    <div class="score-panel">
                      ${buildFactorExplanationList(item.factor_scores)}
                      <div class="factor-grid" style="margin-top: 10px;">${buildFactorChips(item.factor_scores)}</div>
                    </div>
                  </details>
                </div>
                <span class="breakout-badge">最新突破</span>
                <div class="compact-topline">
                  <span>收盤價 <strong>${escapeHtml(closePrice)}</strong></span>
                  <span>完整報告 <strong>→</strong></span>
                </div>
                <div class="compact-meta-grid">
                  <div class="compact-meta-item"><span>盤面重點</span><strong>${escapeHtml(reasons[0] || '資料待補')}</strong></div>
                  <div class="compact-meta-item"><span>基本面重點</span><strong>${escapeHtml(reasons[1] || reasons[2] || '資料待補')}</strong></div>
                </div>
                <div class="compact-score-note">${escapeHtml(buildModelSummary(reasons))}</div>
                <a class="stock-link compact-score-note" href="${reportUrl}">返回個股完整報告 →</a>
              </td>
              <td data-label="盤面">
                <div class="metric-card">
                  <div class="metric-row"><span class="metric-label">收盤價</span><span class="metric-value">${escapeHtml(closePrice)}</span></div>
                  <div class="market-summary">${escapeHtml(buildMarketSummary(reasons))}</div>
                </div>
              </td>
              <td data-label="基本面">
                <div class="metric-card">
                  <div class="fundamental-summary">${escapeHtml(buildFundamentalSummary(reasons))}</div>
                </div>
              </td>
              <td class="score-box" data-label="模型">
                <div class="score-box-hint"><strong>點左側模型分數</strong> 可展開五個因子分數、權重與 0 分原因。</div>
              </td>
            </tr>
          `;
        }).join('');

        return `
          <div class="screener-scroll">
            <table class="screener-table">
              <thead>
                <tr>
                  <th>股票</th>
                  <th>盤面</th>
                  <th>基本面</th>
                  <th>模型</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      async function loadLatestScreener() {
        try {
          const response = await fetch('/api/screener/latest');
          const payload = await response.json();
          if (!response.ok) {
            screener.innerHTML = '<div class="placeholder">目前無法載入今日推薦排名。</div>';
            return;
          }
          if (!payload.results || payload.results.length === 0) {
            screener.innerHTML = '<div class="placeholder">尚未產生今日推薦排名。</div>';
            return;
          }
          screener.style.margin = '0';
          screener.style.border = '0';
          screener.style.background = 'transparent';
          const generatedLabel = payload.run_date || 'N/A';
          const timestampLabel = payload.generated_at || '';
          screener.innerHTML = `
            <div style="padding: 18px 22px 0;" class="muted">策略更新日：${escapeHtml(generatedLabel)}　${escapeHtml(timestampLabel)}　｜　候選數：${escapeHtml(payload.candidate_count ?? 'N/A')}</div>
            ${buildScreenerTable(payload)}
          `;
        } catch (error) {
          screener.innerHTML = '<div class="placeholder">目前無法載入今日推薦排名。</div>';
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const ticker = document.getElementById('ticker').value;
        submitButton.disabled = true;
        submitButton.textContent = '分析中...';
        result.innerHTML = '<div class="placeholder">分析中，請稍候...</div>';
        try {
          const response = await fetch('/api/report', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ticker})
          });
          const payload = await response.json();
          if (!response.ok) {
            result.innerHTML = `<div class="placeholder">${payload.detail || '產生報告時發生錯誤'}</div>`;
            return;
          }
          result.innerHTML = payload.report_html;
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = '開始分析';
        }
      });

      loadLatestScreener();
    </script>
  </body>
</html>
