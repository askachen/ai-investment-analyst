<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 投資分析師</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-soft: #0d1b2c;
        --card: #0f1f33;
        --card-2: #132844;
        --line: rgba(148, 163, 184, 0.18);
        --text: #ecf5ff;
        --muted: #99a9bf;
        --accent: #60a5fa;
        --accent-2: #2563eb;
        --rose: #fb7185;
        --rose-soft: rgba(251, 113, 133, 0.16);
        --emerald: #34d399;
        --emerald-soft: rgba(52, 211, 153, 0.14);
        --amber: #fbbf24;
        --amber-soft: rgba(251, 191, 36, 0.14);
        --white: #ffffff;
        --shadow: 0 20px 45px rgba(2, 6, 23, 0.35);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
        background:
          radial-gradient(circle at top right, rgba(37, 99, 235, 0.22), transparent 30%),
          radial-gradient(circle at top left, rgba(251, 113, 133, 0.16), transparent 24%),
          var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 1320px;
        margin: 0 auto;
        padding: 20px 12px 40px;
      }

      .hero,
      .dashboard,
      .panel,
      .report-shell {
        background: linear-gradient(180deg, rgba(19, 40, 68, 0.96), rgba(10, 21, 37, 0.98));
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 28px;
        margin-bottom: 18px;
      }

      .hero-top {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .hero-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: 38px;
        line-height: 1.1;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
      }

      .hero-badges {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .logout-form {
        margin: 0;
      }

      .logout-button {
        padding: 9px 14px;
        border: 1px solid rgba(251, 113, 133, 0.26);
        border-radius: 999px;
        background: rgba(251, 113, 133, 0.12);
        color: #ffd4da;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .hero-badge {
        padding: 9px 14px;
        border-radius: 999px;
        border: 1px solid rgba(96, 165, 250, 0.22);
        background: rgba(96, 165, 250, 0.12);
        color: #dbeafe;
        font-size: 13px;
        font-weight: 700;
      }

      .dashboard {
        overflow: hidden;
        margin-bottom: 20px;
      }

      .dashboard-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.18), rgba(15, 23, 42, 0));
      }

      .dashboard-header h2 {
        margin: 0;
        font-size: 24px;
      }

      .dashboard-subtitle,
      .muted {
        color: var(--muted);
        font-size: 14px;
      }

      .strategy-tabs {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 16px 22px 0;
      }

      .strategy-chip {
        border: 1px solid rgba(96, 165, 250, 0.18);
        background: rgba(15, 23, 42, 0.58);
        color: #dce9ff;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.2;
        cursor: pointer;
        transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      }

      .strategy-chip:hover {
        transform: translateY(-1px);
        border-color: rgba(96, 165, 250, 0.4);
      }

      .strategy-chip.is-active {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.95), rgba(96, 165, 250, 0.86));
        color: #fff;
        border-color: transparent;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      }

      .strategy-chip small {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        font-weight: 600;
        color: inherit;
        opacity: 0.86;
      }

      .strategy-summary {
        padding: 12px 22px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .strategy-summary-text {
        color: var(--muted);
      }

      .strategy-weights {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .strategy-weight-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.58);
        border: 1px solid rgba(96, 165, 250, 0.18);
        color: #dce9ff;
        font-size: 12px;
        font-weight: 700;
      }

      .strategy-weight-chip strong {
        color: #ffffff;
      }

      .dashboard-decision-brief {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(180px, 0.8fr));
        gap: 12px;
        padding: 16px 18px 0;
      }

      .decision-brief-card {
        padding: 16px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(15, 23, 42, 0.48));
        border: 1px solid rgba(96, 165, 250, 0.18);
      }

      .decision-brief-card.is-primary {
        border-color: rgba(96, 165, 250, 0.34);
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.26), rgba(15, 23, 42, 0.58));
      }

      .decision-brief-label {
        display: block;
        margin-bottom: 8px;
        color: #9db2d1;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }

      .decision-brief-title {
        margin: 0 0 8px;
        color: #f8fbff;
        font-size: 22px;
        line-height: 1.15;
      }

      .decision-brief-body {
        margin: 0;
        color: #dce8f8;
        font-size: 13px;
        line-height: 1.55;
      }

      .decision-brief-action {
        display: inline-flex;
        margin-top: 12px;
        color: #dbeafe;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }

      .decision-brief-action:hover,
      .decision-brief-action:focus-visible {
        color: #ffffff;
      }

      .snapshot-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        padding: 16px 18px 0;
      }

      .snapshot-card {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "label value"
          "note note";
        gap: 4px 10px;
        align-items: center;
        min-height: 74px;
        padding: 12px 14px;
        overflow: hidden;
        border-radius: 18px;
        background:
          linear-gradient(135deg, rgba(96, 165, 250, 0.10), rgba(15, 23, 42, 0.34)),
          rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(148, 163, 184, 0.14);
      }

      .snapshot-card::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;
        background: linear-gradient(180deg, rgba(96, 165, 250, 0.9), rgba(37, 99, 235, 0.12));
      }

      .snapshot-label {
        grid-area: label;
        color: #9db2d1;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }

      .snapshot-value {
        grid-area: value;
        color: #f8fbff;
        font-size: 20px;
        font-weight: 900;
        line-height: 1.15;
        text-align: right;
        white-space: nowrap;
      }

      .snapshot-note {
        grid-area: note;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .freshness-status {
        border-color: rgba(52, 211, 153, 0.28);
        background:
          linear-gradient(135deg, rgba(52, 211, 153, 0.12), rgba(15, 23, 42, 0.34)),
          rgba(255, 255, 255, 0.035);
      }

      .freshness-status::before {
        background: linear-gradient(180deg, rgba(52, 211, 153, 0.95), rgba(52, 211, 153, 0.12));
      }

      .freshness-status.is-stale {
        border-color: rgba(251, 191, 36, 0.38);
        background:
          linear-gradient(135deg, rgba(251, 191, 36, 0.13), rgba(15, 23, 42, 0.34)),
          rgba(255, 255, 255, 0.035);
      }

      .freshness-status.is-stale::before {
        background: linear-gradient(180deg, rgba(251, 191, 36, 0.95), rgba(251, 191, 36, 0.12));
      }

      .freshness-status.is-unknown {
        border-color: rgba(148, 163, 184, 0.2);
      }

      .freshness-status.is-unknown::before {
        background: linear-gradient(180deg, rgba(148, 163, 184, 0.85), rgba(148, 163, 184, 0.1));
      }

      .screener-scroll {
        overflow-x: auto;
      }

      .screener-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1020px;
      }

      .screener-table thead th {
        text-align: left;
        padding: 16px 18px;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #d6e4ff;
        background: rgba(15, 23, 42, 0.52);
      }

      .screener-table tbody td {
        padding: 18px;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }

      .screener-table tbody tr:hover {
        background: rgba(148, 163, 184, 0.05);
      }

      .stock-cell {
        min-width: 220px;
      }

      .stock-link {
        display: block;
        color: inherit;
        text-decoration: none;
      }

      .stock-link:hover .stock-main,
      .stock-link:focus-visible .stock-main {
        color: #bfdbfe;
      }

      .stock-link:focus-visible {
        outline: 2px solid rgba(96, 165, 250, 0.7);
        outline-offset: 4px;
        border-radius: 14px;
      }

      .stock-rank {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.3), rgba(96, 165, 250, 0.14));
        color: #eff6ff;
        font-weight: 900;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        flex: 0 0 auto;
      }

      .stock-rank-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .stock-rank-label {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        color: #eef4ff;
      }

      .stock-rank-prefix {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #9db2d1;
      }

      .rank-value {
        font-size: 28px;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .stock-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .stock-main {
        display: grid;
        gap: 3px;
        font-size: 22px;
        font-weight: 800;
        line-height: 1.15;
      }

      .stock-primary-name {
        font-size: 24px;
        font-weight: 800;
        color: #f8fbff;
        letter-spacing: -0.02em;
      }

      .stock-secondary-code {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
        color: #eaf2ff;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      .stock-code {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .stock-name {
        color: #f8fbff;
        font-size: 16px;
        font-weight: 700;
      }

      .score-details {
        min-width: 120px;
      }

      .score-details summary {
        list-style: none;
      }

      .score-details summary::-webkit-details-marker {
        display: none;
      }

      .score-badge {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        padding: 9px 12px;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.92), rgba(96, 165, 250, 0.88));
        color: white;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
      }

      .score-badge strong {
        font-size: 24px;
        line-height: 1;
      }

      .score-panel {
        margin-top: 10px;
        padding: 12px;
        border-radius: 14px;
        background: rgba(8, 19, 33, 0.92);
        border: 1px solid rgba(96, 165, 250, 0.18);
      }

      .factor-explainer {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .factor-explainer p {
        margin: 0 0 8px;
      }

      .factor-explainer p:last-child {
        margin-bottom: 0;
      }

      .stock-main small {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
      }

      .compact-topline {
        display: none;
      }

      .report-entry-link {
        color: #dbeafe;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }

      .report-entry-link:hover,
      .report-entry-link:focus-visible {
        color: #ffffff;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .summary-card {
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .summary-card-title {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .summary-card-body {
        color: #e5eefc;
        font-size: 13px;
        line-height: 1.45;
      }

      .detail-section {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .detail-section-title {
        display: block;
        margin-bottom: 10px;
        font-size: 13px;
        font-weight: 800;
        color: #dce8f8;
        letter-spacing: 0.08em;
      }

      .metric-card {
        display: grid;
        gap: 10px;
      }

      .metric-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
        font-size: 14px;
      }

      .metric-label {
        color: var(--muted);
      }

      .metric-value {
        color: var(--white);
        font-weight: 800;
        text-align: right;
        font-size: 22px;
        line-height: 1.1;
      }

      .market-summary,
      .fundamental-summary {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        color: #dce8f8;
        font-size: 13px;
        line-height: 1.5;
      }

      .factor-grid {
        display: grid;
        gap: 10px;
      }

      .factor-card {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(148, 163, 184, 0.10);
      }

      .factor-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }

      .factor-card-label {
        color: #eef4ff;
        font-size: 12px;
        font-weight: 700;
      }

      .factor-card-score {
        color: #dbeafe;
        font-size: 12px;
        font-weight: 800;
      }

      .factor-meter {
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }

      .factor-meter-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #5e6ad2, #8b95ff);
      }

      .factor-raw-value {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .factor-chip {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(96, 165, 250, 0.08);
        border: 1px solid rgba(96, 165, 250, 0.14);
        font-size: 13px;
      }

      .factor-chip span:last-child {
        color: #dbeafe;
        font-weight: 700;
      }

      .score-box {
        min-width: 180px;
      }

      .score-box-hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .score-box-hint strong {
        color: #dbeafe;
      }

      .score-pill {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.92), rgba(96, 165, 250, 0.88));
        color: white;
        font-weight: 800;
      }

      .score-pill strong {
        font-size: 28px;
        line-height: 1;
      }

      .score-note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .panel,
      .report-shell {
        padding: 22px;
        margin-top: 20px;
      }

      input, button, textarea {
        font-size: 16px;
      }

      input {
        width: min(280px, 100%);
        padding: 12px 14px;
        color: var(--text);
        background: rgba(15, 23, 42, 0.6);
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.22);
      }

      button {
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .form-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .report-card { display: grid; gap: 20px; }
      .report-header h1 { margin: 0 0 8px; font-size: 32px; }
      .report-badges { display: flex; gap: 10px; flex-wrap: wrap; }
      .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
      .badge-rating { background: rgba(96, 165, 250, 0.14); color: #dbeafe; }
      .badge-confidence { background: rgba(52, 211, 153, 0.14); color: #c9ffe6; }
      .report-insights,
      .quick-brief,
      .scenario-overview,
      .observation-radar,
      .analyst-takeaway,
      .risk-focus {
        display: grid;
        gap: 12px;
        padding: 18px;
        border-radius: 20px;
        border: 1px solid rgba(148, 163, 184, 0.18);
      }
      .report-insights {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(37, 99, 235, 0.18));
        border-color: rgba(96, 165, 250, 0.18);
      }
      .quick-brief {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.22), rgba(15, 23, 42, 0.92));
        border-color: rgba(96, 165, 250, 0.22);
      }
      .scenario-overview {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(96, 165, 250, 0.14));
        border-color: rgba(96, 165, 250, 0.18);
      }
      .observation-radar {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(148, 163, 184, 0.12));
      }
      .analyst-takeaway {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.16), rgba(15, 23, 42, 0.88));
        border-color: rgba(96, 165, 250, 0.2);
      }
      .risk-focus {
        background: linear-gradient(135deg, rgba(251, 113, 133, 0.14), rgba(15, 23, 42, 0.88));
        border-color: rgba(251, 113, 133, 0.22);
      }
      .report-insights-title,
      .quick-brief-title,
      .scenario-overview-title,
      .observation-radar-title,
      .analyst-takeaway-title,
      .risk-focus-title {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .report-insights-title,
      .quick-brief-title,
      .scenario-overview-title,
      .analyst-takeaway-title {
        color: #bfd7f7;
      }
      .observation-radar-title {
        color: #d8e5f8;
      }
      .risk-focus-title {
        color: #ffd4da;
      }
      .report-insights-grid,
      .quick-brief-grid,
      .financial-snapshot-grid,
      .scenario-grid,
      .observation-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
      .insight-card,
      .quick-brief-card,
      .financial-snapshot-card,
      .scenario-card,
      .observation-card {
        display: grid;
        gap: 8px;
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }
      .insight-label,
      .quick-brief-label,
      .financial-snapshot-label,
      .scenario-card-label,
      .observation-card-label {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #9db2d1;
      }
      .insight-card strong,
      .quick-brief-card strong {
        font-size: 16px;
        line-height: 1.55;
        color: #f8fbff;
      }

  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="hero-top">
          <div>
            <h1>AI 投資分析師</h1>
            <p>把每日推薦股做成可讀性更高的策略儀表板，並可直接往下延伸成完整個股分析報告。</p>
          </div>
          <div class="hero-actions">
            {% if show_logout %}
            <form class="logout-form" method="post" action="/logout">
              <button type="submit" class="logout-button">登出</button>
            </form>
            {% endif %}
            <div class="hero-badges">
              <span class="hero-badge">策略榜單</span>
              <span class="hero-badge">每日排程更新</span>
              <span class="hero-badge">可解釋模型</span>
            </div>
          </div>
        </div>
      </section>

      <section class="dashboard">
        <div class="dashboard-header">
          <div>
            <h2>推薦股策略排行</h2>
            <div class="dashboard-subtitle">類似策略儀表板的單頁展示：股票 / 盤面 / 基本面 / 模型</div>
          </div>
          <div class="legend">
            <span><i class="hot"></i> 強勢 / 突破</span>
            <span><i class="good"></i> 正向基本面</span>
            <span><i class="warn"></i> 需持續觀察</span>
          </div>
        </div>
        <div id="strategy-tabs" class="strategy-tabs"></div>
        <div id="strategy-summary" class="strategy-summary">
          <div class="strategy-summary-text">可切換不同策略權重觀察同一批候選股。</div>
          <div id="strategy-weights" class="strategy-weights"></div>
        </div>
        <div id="daily-screener" class="placeholder" style="margin: 18px;">載入今日推薦中...</div>
      </section>

      <section class="panel">
        <form id="report-form">
          <div class="form-row">
            <input type="text" name="ticker" id="ticker" placeholder="請輸入股票代號，例如 2330" value="{{ ticker }}" />
            <button type="submit">開始分析</button>
          </div>
        </form>
        <p class="muted">本內容僅供參考，不構成投資建議。</p>
      </section>

      <section class="report-shell">
        <div id="result-html" class="placeholder">{% if result %}{{ result }}{% else %}尚未產生報告{% endif %}</div>
      </section>
    </main>

    <script>
      const form = document.getElementById('report-form');
      const result = document.getElementById('result-html');
      const screener = document.getElementById('daily-screener');
      const strategyTabs = document.getElementById('strategy-tabs');
      const strategySummary = document.getElementById('strategy-summary');
      const strategyWeights = document.getElementById('strategy-weights');
      const submitButton = form.querySelector('button[type="submit"]');
      const DEFAULT_STRATEGIES = [
        {
          key: 'balanced',
          label: '平衡多因子',
          description: '兼顧盤面、營收、品質、估值與流動性。',
          weights: {momentum: '25%', revenue: '30%', quality: '15%', valuation: '20%', liquidity: '10%'},
        },
        {
          key: 'growth',
          label: '成長動能',
          description: '提高營收成長與價格動能權重。',
          weights: {momentum: '30%', revenue: '35%', quality: '15%', valuation: '10%', liquidity: '10%'},
        },
        {
          key: 'value',
          label: '價值穩健',
          description: '提高估值與品質權重。',
          weights: {momentum: '15%', revenue: '15%', quality: '20%', valuation: '40%', liquidity: '10%'},
        },
        {
          key: 'flow',
          label: '流動性強勢',
          description: '提高動能與成交量權重。',
          weights: {momentum: '35%', revenue: '20%', quality: '10%', valuation: '10%', liquidity: '25%'},
        },
      ];
      let activeStrategy = 'balanced';

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function factorLabel(key) {
        return {
          momentum: '盤面',
          revenue: '營收',
          quality: '品質',
          valuation: '估值',
          liquidity: '流動性',
        }[key] || key;
      }

      function formatDecimal(value, digits = 1) {
        if (value === null || value === undefined || value === '') {
          return 'N/A';
        }
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) {
          return String(value);
        }
        return numeric.toFixed(digits).replace(/\.0+$|(?<=\.[0-9]*[1-9])0+$/u, '');
      }

      function formatPrice(value) {
        return formatDecimal(value, 2);
      }

      function formatSnapshotTime(value) {
        if (!value) {
          return '等待最新批次';
        }
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) {
          return String(value).replace(/\.\d+\+00:00$/, 'Z');
        }
        const date = parsed.toISOString().slice(0, 10);
        const time = parsed.toISOString().slice(11, 16);
        return `${date} ${time} UTC`;
      }

      function buildFactorExplanation(key, value) {
        const score = Number(value || 0);
        const base = {
          momentum: '看近 5 日與近 10 日漲幅；短線動能越強，分數越高。',
          revenue: '看月營收年增與月增；成長越明顯，分數越高。',
          quality: '看 EPS 是否為正且數值夠高；EPS 偏弱時容易接近 0 分。',
          valuation: '看 PE / PB 是否仍在相對可接受區間；越便宜分數越高。',
          liquidity: '看近 5 日平均成交量；量太小時流動性分數會偏低。',
        }[key] || '依據該因子的原始資料計算。';
        if (score <= 0) {
          return `${base} 目前顯示 0 分，通常代表該因子偏弱、資料不足，或未達基本門檻。`;
        }
        return base;
      }

      function buildRawFactorValue(key, reasons) {
        return {
          momentum: reasons[0] || '近 5 / 10 日動能資料待補',
          revenue: reasons[1] || '營收資料待補',
          quality: reasons[2] || 'EPS 資料待補',
          valuation: reasons[3] || '估值資料待補',
          liquidity: reasons[4] || '流動性資料待補',
        }[key] || '原始值資料待補';
      }

      function buildMarketSummary(reasons) {
        return reasons[0] || '目前尚無額外盤面摘要。';
      }

      function buildFundamentalSummary(reasons) {
        return [reasons[1], reasons[2], reasons[3]].filter(Boolean).join(' ')
          || '目前尚無完整基本面摘要。';
      }

      function buildModelSummary(reasons) {
        return reasons[4] || reasons[5] || '模型綜合動能、營收、品質、估值與流動性進行排序。';
      }

      function buildReportUrl(ticker) {
        return `/stocks/${encodeURIComponent(ticker)}`;
      }

      function buildStrategyTabs(payload) {
        const strategies = payload.strategies?.length ? payload.strategies : DEFAULT_STRATEGIES;
        if (strategies.length === 0) {
          strategyTabs.innerHTML = '';
          strategySummary.querySelector('.strategy-summary-text').textContent = '目前沒有可切換的策略。';
          strategyWeights.innerHTML = '';
          return;
        }
        strategyTabs.innerHTML = strategies.map((strategy) => `
          <button
            type="button"
            class="strategy-chip ${strategy.key === activeStrategy ? 'is-active' : ''}"
            data-strategy="${escapeHtml(strategy.key)}"
          >
            ${escapeHtml(strategy.label)}
            <small>${escapeHtml(strategy.description)}</small>
          </button>
        `).join('');
        const active = payload.strategy || strategies.find((item) => item.key === activeStrategy) || strategies[0];
        strategySummary.querySelector('.strategy-summary-text').textContent = `${active.label}：${active.description}`;
        strategyWeights.innerHTML = buildStrategyWeightChips(active);
        strategyTabs.querySelectorAll('[data-strategy]').forEach((button) => {
          button.addEventListener('click', () => {
            const strategy = button.getAttribute('data-strategy');
            if (!strategy || strategy === activeStrategy) {
              return;
            }
            activeStrategy = strategy;
            loadLatestScreener(strategy);
          });
        });
      }

      function buildFactorChips(factorScores) {
        const entries = Object.entries(factorScores || {});
        if (entries.length === 0) {
          return '<div class="factor-chip"><span>模型因子</span><span>資料不足</span></div>';
        }
        return entries.map(([key, value]) => `
          <div class="factor-chip">
            <span>${escapeHtml(factorLabel(key))}</span>
            <span>${escapeHtml(formatDecimal(value))}/100</span>
          </div>
        `).join('');
      }

      function buildStrategyWeightChips(strategy) {
        const weights = Object.entries(strategy?.weights || {});
        if (weights.length === 0) {
          return '';
        }
        return weights.map(([key, value]) => `
          <span class="strategy-weight-chip"><span>${escapeHtml(factorLabel(key))}</span><strong>${escapeHtml(value)}</strong></span>
        `).join('');
      }

      function buildWeightSummaryText(weights) {
        const entries = Object.entries(weights || {});
        if (entries.length === 0) {
          return '總分：綜合五個因子加權後的結果。';
        }
        const summary = entries.map(([key, value]) => `${factorLabel(key)} ${value}`).join('、');
        return `總分：綜合五個因子加權後的結果。此策略權重為 ${summary}。`;
      }

      function buildDashboardDecisionBrief(payload) {
        const topPick = payload.results[0];
        if (!topPick) {
          return '';
        }
        const reasons = topPick.reasons || [];
        const topName = topPick.display_name || topPick.ticker;
        const strategyLabel = payload.strategy?.label || '平衡多因子';
        const freshnessMessage = payload.freshness_message || '等待最新批次。';
        return `
          <section class="dashboard-decision-brief" aria-label="今日決策入口">
            <article class="decision-brief-card is-primary">
              <span class="decision-brief-label">今日決策入口</span>
              <h3 class="decision-brief-title">優先看第一名：${escapeHtml(topName)}</h3>
              <p class="decision-brief-body">${escapeHtml(strategyLabel)} 目前排序第一，模型分數 ${escapeHtml(formatDecimal(topPick.total_score))}。${escapeHtml(buildMarketSummary(reasons))}</p>
              <a class="decision-brief-action" href="${buildReportUrl(topPick.ticker)}">下一步行動：進入完整報告</a>
            </article>
            <article class="decision-brief-card">
              <span class="decision-brief-label">資料可信度</span>
              <h3 class="decision-brief-title">${escapeHtml(payload.freshness_status || 'unknown')}</h3>
              <p class="decision-brief-body">${escapeHtml(freshnessMessage)}</p>
            </article>
            <article class="decision-brief-card">
              <span class="decision-brief-label">下一步行動</span>
              <h3 class="decision-brief-title">先讀榜首，再比前 12 名</h3>
              <p class="decision-brief-body">從榜首完整報告確認風險與資料品質，再回到排行比較盤面與基本面。</p>
            </article>
          </section>
        `;
      }

      function buildScreenerSnapshot(payload) {
        const candidateCount = payload.candidate_count ?? payload.results.length ?? 'N/A';
        const universeSize = payload.universe_size ?? payload.results.length ?? 'N/A';
        const visibleCount = payload.results.length;
        const freshnessStatus = payload.freshness_status || 'unknown';
        const freshnessLabel = {
          fresh: '正常',
          stale: '需檢查',
          unknown: '等待中',
        }[freshnessStatus] || freshnessStatus;
        const cards = [
          {
            label: '更新日',
            value: payload.run_date || 'N/A',
            note: `批次 ${formatSnapshotTime(payload.generated_at)}`,
            extraClass: 'is-date',
          },
          {
            label: '資料新鮮度',
            value: freshnessLabel,
            note: payload.freshness_message || '等待最新批次。',
            extraClass: `freshness-status is-${freshnessStatus} is-freshness`,
          },
          {
            label: '股票池',
            value: String(universeSize),
            note: '本次評分覆蓋的股票數量',
          },
          {
            label: '候選名單',
            value: String(candidateCount),
            note: '通過條件後進入排名的股票',
          },
          {
            label: '排行檢視',
            value: `前 ${visibleCount} 名`,
            note: payload.strategy?.label || '平衡多因子',
          },
        ];
        return `
          <div class="snapshot-strip">
            ${cards.map((card) => `
              <article class="snapshot-card ${escapeHtml(card.extraClass || '')}">
                <span class="snapshot-label">${escapeHtml(card.label)}</span>
                <strong class="snapshot-value">${escapeHtml(card.value)}</strong>
                <span class="snapshot-note">${escapeHtml(card.note)}</span>
              </article>
            `).join('')}
          </div>
        `;
      }

      function buildFactorExplanationList(factorScores, weights) {
        const entries = Object.entries(factorScores || {});
        if (entries.length === 0) {
          return '<div class="factor-explainer"><p>目前沒有足夠資料可拆解模型因子。</p></div>';
        }
        return `
          <div class="factor-explainer">
            <p>${escapeHtml(buildWeightSummaryText(weights))}</p>
            <p>為什麼會 0 分？通常代表該因子目前偏弱、資料不足，或沒有通過最低門檻。</p>
            ${entries.map(([key, value]) => `<p><strong>${escapeHtml(factorLabel(key))} ${escapeHtml(formatDecimal(value))}/100：</strong>${escapeHtml(buildFactorExplanation(key, value))}</p>`).join('')}
          </div>
        `;
      }

      function buildFactorCards(factorScores, reasons) {
        const entries = Object.entries(factorScores || {});
        if (entries.length === 0) {
          return '<div class="factor-card"><div class="factor-raw-value">目前沒有足夠資料可顯示因子卡。</div></div>';
        }
        return entries.map(([key, value]) => {
          const score = Math.max(0, Math.min(100, Number(value || 0)));
          return `
            <div class="factor-card">
              <div class="factor-card-top">
                <span class="factor-card-label">${escapeHtml(factorLabel(key))}</span>
                <span class="factor-card-score">${escapeHtml(formatDecimal(value))}/100</span>
              </div>
              <div class="factor-meter"><div class="factor-meter-fill" style="width:${score}%;"></div></div>
              <div class="factor-raw-value">${escapeHtml(buildRawFactorValue(key, reasons))}</div>
            </div>
          `;
        }).join('');
      }

      function buildScreenerTable(payload) {
        const rows = payload.results.slice(0, 12).map((item) => {
          const reasons = item.reasons || [];
          const reportUrl = buildReportUrl(item.ticker);
          const totalScore = formatDecimal(item.total_score);
          const closePrice = formatPrice(item.close_price);
          const primaryName = item.display_name || item.ticker;
          const secondaryCode = item.display_name ? item.ticker : '台股代號';
          return `
            <tr>
              <td class="stock-cell" data-label="">
                <div class="stock-rank-row">
                  <div class="stock-rank"><span class="rank-value">${escapeHtml(item.rank)}</span></div>
                  <div class="stock-rank-label">
                    <span class="stock-rank-prefix">No.</span>
                    <span class="stock-secondary-code">${escapeHtml(secondaryCode)}</span>
                  </div>
                </div>
                <div class="stock-header">
                  <a class="stock-link" href="${reportUrl}">
                    <div class="stock-main">
                      <div class="stock-primary-name">${escapeHtml(primaryName)}</div>
                    </div>
                  </a>
                  <details class="score-details">
                    <summary class="score-badge"><span>模型分數</span><strong>${escapeHtml(totalScore)}</strong></summary>
                    <div class="score-panel">
                      ${buildFactorExplanationList(item.factor_scores, payload.strategy?.weights)}
                      <div class="factor-grid" style="margin-top: 10px;">${buildFactorCards(item.factor_scores, reasons)}</div>
                    </div>
                  </details>
                </div>
                <div class="compact-topline">
                  <div>
                    <span class="metric-label">收盤價</span>
                    <strong>${escapeHtml(closePrice)}</strong>
                  </div>
                  <a class="report-entry-link" href="${reportUrl}">進入完整報告</a>
                </div>
                <div class="summary-grid">
                  <div class="summary-card">
                    <span class="summary-card-title">盤面重點</span>
                    <div class="summary-card-body">${escapeHtml(buildMarketSummary(reasons))}</div>
                  </div>
                  <div class="summary-card">
                    <span class="summary-card-title">基本面重點</span>
                    <div class="summary-card-body">${escapeHtml(buildFundamentalSummary(reasons))}</div>
                  </div>
                </div>
                <div class="detail-section">
                  <span class="detail-section-title">盤面</span>
                  <div class="metric-card">
                    <div class="market-summary">${escapeHtml(buildMarketSummary(reasons))}</div>
                  </div>
                </div>
                <div class="detail-section">
                  <span class="detail-section-title">基本面</span>
                  <div class="fundamental-summary">${escapeHtml(buildFundamentalSummary(reasons))}</div>
                </div>
              </td>
              <td data-label="盤面">
                <div class="metric-card">
                  <div class="metric-row"><span class="metric-label">收盤價</span><span class="metric-value">${escapeHtml(closePrice)}</span></div>
                  <div class="market-summary">${escapeHtml(buildMarketSummary(reasons))}</div>
                </div>
              </td>
              <td data-label="基本面">
                <div class="metric-card">
                  <div class="fundamental-summary">${escapeHtml(buildFundamentalSummary(reasons))}</div>
                </div>
              </td>
              <td class="score-box" data-label="模型"></td>
            </tr>
          `;
        }).join('');

        return `
          <div class="screener-scroll">
            <table class="screener-table">
              <thead>
                <tr>
                  <th>股票</th>
                  <th>盤面</th>
                  <th>基本面</th>
                  <th>模型</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      async function loadLatestScreener(strategy = activeStrategy) {
        activeStrategy = strategy;
        try {
          const response = await fetch(`/api/screener/latest?strategy=${encodeURIComponent(strategy)}`);
          const payload = await response.json();
          buildStrategyTabs(payload);
          if (!response.ok) {
            screener.innerHTML = '<div class="placeholder">目前無法載入今日推薦排名。</div>';
            return;
          }
          if (!payload.results || payload.results.length === 0) {
            screener.innerHTML = '<div class="placeholder">尚未產生今日推薦排名。</div>';
            return;
          }
          screener.style.margin = '0';
          screener.style.border = '0';
          screener.style.background = 'transparent';
          screener.innerHTML = `
            ${buildDashboardDecisionBrief(payload)}
            ${buildScreenerSnapshot(payload)}
            ${buildScreenerTable(payload)}
          `;
        } catch (error) {
          screener.innerHTML = '<div class="placeholder">目前無法載入今日推薦排名。</div>';
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const ticker = document.getElementById('ticker').value;
        submitButton.disabled = true;
        submitButton.textContent = '分析中...';
        result.innerHTML = '<div class="placeholder">分析中，請稍候...</div>';
        try {
          const response = await fetch('/api/report', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ticker})
          });
          const payload = await response.json();
          if (!response.ok) {
            result.innerHTML = `<div class="placeholder">${payload.detail || '產生報告時發生錯誤'}</div>`;
            return;
          }
          result.innerHTML = payload.report_html;
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = '開始分析';
        }
      });

      loadLatestScreener();
    </script>
  </body>
</html>
